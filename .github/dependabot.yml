version: 2
# Version updates run weekly on Monday at 09:00 UTC.
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    ignore:
      # @vercel/ncc 0.44.1 breaks under TypeScript 7 (pre-commit actions:build).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    assignees:
      - "geoffsee"
    groups:
      # Majors stay ungrouped. A wildcard bun-major group with an open PR
      # marks every dependency handled, so minor and patch updates never open.
      bun-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    assignees:
      - "geoffsee"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
