name: Nightly Build & Deploy

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Restore data cache
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/client/public/data/problems.json
            apps/client/public/data/news.json
            apps/client/public/data/news-history
            apps/client/public/data/cases.json
            apps/client/public/data/case-history
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Refresh data and build client
        uses: ./.github/actions/nightly
        env:
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLISH_API_ORIGIN: ${{ secrets.PUBLISH_API_ORIGIN }}
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          VITE_API_ORIGIN: ${{ secrets.PUBLISH_API_ORIGIN }}
          VITE_LOCAL_AUTH_ENABLED: "false"

      - name: Save data cache
        uses: actions/cache/save@v6
        with:
          path: |
            apps/client/public/data/problems.json
            apps/client/public/data/news.json
            apps/client/public/data/news-history
            apps/client/public/data/cases.json
            apps/client/public/data/case-history
          key: data-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist/client

  # github-pages env currently allows only `master`, but this repo's default
  # branch is `main`. Re-run deploy from `master` so environment branch
  # policies pass without weakening protection rules.
  prepare-master-deploy:
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Point master at this commit and dispatch deploy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_TOKEN is not set; cannot sync master for Pages deploy"
            exit 1
          fi
          git push origin "HEAD:master"
          gh workflow run "Nightly Build & Deploy" --ref master

  deploy:
    needs: build
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
