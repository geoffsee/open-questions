name: Update outdated PR branches

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update out-of-date PR branches
        env:
          # RELEASE_TOKEN (push access) is required: Dependabot ignores
          # @dependabot rebase from GITHUB_TOKEN / github-actions[bot].
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_TOKEN is not set; cannot rebase Dependabot PRs"
            exit 1
          fi

          # Rulesets often report a behind PR as BLOCKED instead of BEHIND.
          gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
            --json number,author,isDraft,mergeStateStatus \
            --jq '.[] | select(.isDraft|not) | select(.mergeStateStatus == "BEHIND" or .mergeStateStatus == "BLOCKED" or .mergeStateStatus == "UNKNOWN") | "\(.number)\t\(.author.login)\t\(.mergeStateStatus)"' \
          | while IFS=$'\t' read -r number author state; do
              if [ "$state" != "BEHIND" ]; then
                mergeable_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq .mergeable_state)"
                if [ "$mergeable_state" != "behind" ]; then
                  echo "Skipping PR #$number ($author, $state / ${mergeable_state:-unknown})"
                  continue
                fi
              fi
              echo "Updating PR #$number ($author)..."
              case "$author" in
                dependabot[bot]|app/dependabot)
                  # Dependabot rebase retriggers checks; GITHUB_TOKEN branch updates do not.
                  gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body "@dependabot rebase"
                  ;;
                *)
                  gh pr update-branch "$number" --repo "$GITHUB_REPOSITORY" || {
                    echo "Skipped PR #$number (update failed — likely conflicts)"
                  }
                  ;;
              esac
            done
