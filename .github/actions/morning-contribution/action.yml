name: Morning agent contribution
description: Installs the contributor and submits one morning research contribution.
inputs:
  anthropic-api-key:
    description: Anthropic API key (this or claude-code-oauth-token is required)
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token from `claude setup-token`
    required: false
  model:
    description: Claude model ID (defaults to claude-opus-5-5)
    required: false
  effort:
    description: Reasoning effort - low, medium, high, xhigh or max (defaults to high)
    required: false
  pick-mode:
    description: How to choose the problem - random, or news to prefer problems that overlap the last day of GDELT headlines (falls back to random). Defaults to random.
    required: false
  news-query:
    description: GDELT DOC API query for news pick mode (defaults to a broad science query)
    required: false
  api-token:
    description: Open Questions contributor token
    required: true
  openalex-mailto:
    description: OpenAlex contact email
    required: false
  openalex-api-key:
    description: OpenAlex API key
    required: false
  searxng-url:
    description: SearXNG endpoint
    required: false
  scheduled-cron:
    description: The cron expression that triggered this scheduled run
    required: false
runs:
  using: node24
  main: dist/index.js
